[mcu nhk_2]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339126628-if00
restart_method: command

[extruder2] 
step_pin: nhk_2:gpio23
dir_pin: !nhk_2:gpio24
enable_pin: !nhk_2:gpio25
rotation_distance: 47.546
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: nhk_2:gpio9
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: nhk_2:gpio29
min_temp: -30
max_temp: 355
max_extrude_cross_section: 5
min_extrude_temp: 170
max_extrude_only_distance: 150
#pressure_advance_smooth_time: 0.040
control = pid
pid_kp = 18.360
pid_ki = 1.055
pid_kd = 79.870

[tmc2209 extruder2] # Orbiter2.5
uart_pin: nhk_2:gpio0
tx_pin: nhk_2:gpio1
sense_resistor: 0.100
run_current: 0.6
#stealthchop_threshold: 0

[heater_fan T2_hotend_fan]
pin = nhk_2:gpio5
tachometer_pin = nhk_2:gpio16
tachometer_ppr = 2
tachometer_poll_interval: 0.00015
kick_start_time = 0.5
heater = extruder2
heater_temp = 50
fan_speed = 1.0

# change the fan_generic section name to the tool you are configuring:
# T0_partfan, T1_partfan, etc.
[fan_generic T2_part_fan]
pin = nhk_2:gpio6
kick_start_time = 0.5
off_below = 0.10

[temperature_sensor NH36_T2]
sensor_type = temperature_mcu
sensor_mcu = nhk_2
min_temp = 0
max_temp = 100

# change the tool section name to the tool you are configuring:
# T0, T1, etc.
[tool T2]
tool_number: 2 # change to the index of the tool. 0, 1, 2, etc.
extruder: extruder2
fan: T2_part_fan
params_park_x: 146.20 # The absolute X-position of the tool in its dock.
params_park_y: -40.6 # The absolute Y-position of the tool in its dock.
params_park_z: 289.4 # The absolute Z-position where the tool and shuttle mate in the dock, determined when the TAP (or Z-probe) triggers.
gcode_x_offset: -0.082 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: -0.282 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: -0.29 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# Results from input shaper
params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 84.2
params_input_shaper_damping_ratio_x: 0.040
params_input_shaper_type_y: '3hump_ei'
params_input_shaper_freq_y: 60.6
params_input_shaper_damping_ratio_y: 0.051

# change the tool_probe section name to the tool you are configuring:
# T0, T1, etc.
[tool_probe T2]
pin: nhk_2:gpio10
tool: 2
x_offset = 0
y_offset = 0
z_offset = -1.280 # Needs to be calibrated. More positive = More Squish
speed: 5.0
lift_speed = 35
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2

# change the gcode_macro section name to the tool you are configuring:
# T0, T1, etc.
[gcode_macro T2]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
gcode:
    _CQGL                  # Make sure we are leveled already, before we pick up the tool
    SELECT_TOOL T=2 RESTORE_AXIS=XYZ

# change the accelerometer section name to the tool you are configuring:
# T0, T1, etc.
[adxl345 T2]
cs_pin: nhk_2:gpio27
spi_software_sclk_pin: nhk_2:gpio18
spi_software_mosi_pin: nhk_2:gpio20
spi_software_miso_pin: nhk_2:gpio19
axes_map: -x, -z, -y

[neopixel t2_leds]
pin: nhk_2:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 0

[led_effect t2_logo]
leds:
    neopixel:t2_leds (1)
autostart: false
frame_rate: 24
recalculate: true
layers:
    {params.LAYER|default('static')} {params.RATE|default(0)} {params.CUTOFF|default(0)} {params.BLEND|default('top')} {params.PALETTE|default('(0,0,0,0)')}

[led_effect t2_nozzle]
leds:
    neopixel:t2_leds (2,3)
autostart: false
frame_rate: 24
recalculate: true
layers:
    {params.LAYER|default('static')} {params.RATE|default(0)} {params.CUTOFF|default(0)} {params.BLEND|default('top')} {params.PALETTE|default('(0,0,0,0)')}