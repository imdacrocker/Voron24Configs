[multi_pin bed_fan_pins]
pins: PD14, PD15

[fan_generic bed_fans]
pin: multi_pin:bed_fan_pins
kick_start_time: 0.5

[gcode_macro _BEDFANVARS]
variable_heating_threshold: 90            # If bed temp target is above this threshold, fans will be enabled.
variable_cooling_threshold: 50             # While bed is cooling down, if temp is above this threshold, fans will be controlled.
variable_cooling_delta:     10             # Fast fan speed will be used for cooling until within delta of chamber temp.
variable_fast:              1            # Fan speed used for printing and initial cooling.
variable_slow:              0.5            # Fan speed used while bed is heating and while within cooling delta.
variable_fan:               "bed_fans"     # Name of the fan to control.
variable_chamber_sensor:    "chamber" # Name of the temperature sensor to monitor while cooling.
gcode:


[gcode_macro BEDFANSSLOW]
gcode:
    {% set slow = printer["gcode_macro _BEDFANVARS"].slow|float %}
    {% set fan = printer["gcode_macro _BEDFANVARS"].fan %}
    SET_FAN_SPEED FAN={fan} SPEED={slow}


[gcode_macro BEDFANSFAST]
gcode:
    {% set fast = printer["gcode_macro _BEDFANVARS"].fast|float %}
    {% set fan = printer["gcode_macro _BEDFANVARS"].fan %}
    SET_FAN_SPEED FAN={fan} SPEED={fast}


[gcode_macro BEDFANSOFF]
gcode:
    {% set fan = printer["gcode_macro _BEDFANVARS"].fan %}
    SET_FAN_SPEED FAN={fan} SPEED=0