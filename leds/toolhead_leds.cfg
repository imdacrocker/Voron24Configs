[gcode_macro set_logo_leds_off]
gcode:
    {% set n = params.TOOL | default(printer.toolchanger.tool_number) | int %}
    {% if n >= 0 %}
    STOP_LED_EFFECTS LEDS=t{tool.tool_number}_leds
    SET_LED LED=t{tool.tool_number}_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1
    {% endif %}

[gcode_macro set_logo_leds_active]
gcode:
    {% set n = params.TOOL | default(printer.toolchanger.tool_number) | int %}
    {% if n >= 0 %}
    STOP_LED_EFFECTS LEDS=t{tool.tool_number}_leds
    SET_LED LED=t{tool.tool_number}_leds RED=0 GREEN=1 BLUE=0 WHITE=0 INDEX=1
    {% endif %}

[gcode_macro set_logo_leds_idle]
gcode:
    {% set n = params.TOOL | default(printer.toolchanger.tool_number) | int %}
    {% if n >= 0 %}
    STOP_LED_EFFECTS LEDS=t{tool.tool_number}_leds
    SET_LED LED=t{tool.tool_number}_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1
    {% endif %}

[gcode_macro set_nozzle_leds_on]
gcode:
    {% set n = params.TOOL | default(printer.toolchanger.tool_number) | int %}
    {% if n >= 0 %}
        STOP_LED_EFFECTS LEDS="neopixel:t{n}_leds (2,3)"
        SET_LED LED=t{n}_leds RED=.6 GREEN=.6 BLUE=.6 WHITE=.6 INDEX=2 TRANSMIT=0
        SET_LED LED=t{n}_leds RED=.6 GREEN=.6 BLUE=.6 WHITE=.6 INDEX=3
    {% endif %}

[gcode_macro set_nozzle_leds_off]
gcode:
    {% set n = params.TOOL | default(printer.toolchanger.tool_number) | int %}
    {% if n >= 0 %}
    STOP_LED_EFFECTS LEDS=t{tool.tool_number}_leds
    SET_LED LED=t{tool.tool_number}_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=t{tool.tool_number}_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3
    {% endif %}