######################################################################
#  leds/toolhead_leds.cfg
#
#  All per-tool LED behaviour is defined ONCE here; the only per-tool config is two [led_effect] blocks that live in each tool's own cfg (see tool_led_effects_snippet.cfg).
#
#  Requires: klipper-led_effect, klipper-toolchanger
######################################################################


######################################################################
#  State table
#
#  Each entry is (layer_type, rate, cutoff, blend_mode, palette).
#  These map directly onto a klipper-led_effect `layers:` line:
#      <type>  <rate>  <cutoff>  <blend>  <palette>
#
#  Palettes must contain NO spaces -- extended gcode params are split
#  on whitespace. Also avoid '#' and ';', which shlex treats as
#  comment characters.
#
#  Colours are (R, G, B, W). Your chains are GRBW, so the 4th value is
#  the dedicated white emitter -- that is the one you want for nozzle
#  illumination.
######################################################################

[gcode_macro _TOOL_LED_CONF]
description: LED state table and current state. Not called directly.
variable_state: 'ready'
variable_logo: {
        'ready':      ('breathing', 3.0, 1.0, 'top', '(0.0,0.6,0.2,0.0)'),
        'busy':       ('breathing', 3.0, 1.0, 'top', '(1.0,0.0,0.0,0.0)'),
        'heating':    ('breathing', 3.0, 1.0, 'top', '(1.0,0.18,0.0,0.0)'),
        'cooling':    ('breathing', 3.0, 1.0, 'top', '(0.0,0.0,1.0,0.0)'),
        'printing':   ('gradient',  0.3, 1.0, 'add', '(0.3,0.0,0.0),(0.3,0.3,0.0),(0.3,0.1,0.0)'),
        'changing':   ('breathing', 1.2, 1.0, 'top', '(0.5,0.0,0.8,0.0)'),
        'part_ready': ('breathing', 3.0, 1.0, 'top', '(0.0,1.0,0.0,0.0)'),
        'idle':       ('gradient',  0.05, 1.0, 'add', '(0.3,0.0,0.0),(0.0,0.3,0.0),(0.0,0.0,0.3)'),
        'docked':     ('static',    0.0, 0.0, 'top', '(0.02,0.02,0.02,0.0)'),
        'off':        ('static',    0.0, 0.0, 'top', '(0.0,0.0,0.0,0.0)')
    }
variable_nozzle: {
        'on':      ('static',    0.0, 0.0, 'top', '(0.0,0.0,0.0,1.0)'),
        'dim':     ('static',    0.0, 0.0, 'top', '(0.0,0.0,0.0,0.35)'),
        'heating': ('breathing', 3.0, 1.0, 'top', '(1.0,0.18,0.0,0.0)'),
        'off':     ('static',    0.0, 0.0, 'top', '(0.0,0.0,0.0,0.0)')
    }
# Which nozzle setting pairs with each logo state.
variable_nozzle_for: {
        'printing':   'on',
        'busy':       'on',
        'changing':   'on',
        'part_ready': 'on',
        'heating':    'heating'
    }
gcode:


######################################################################
#  Dispatcher
######################################################################

[gcode_macro _TOOL_LED]
description: Apply one named state to one tool. T=<n> PART=logo|nozzle STATE=<name>
gcode:
    {% set conf = printer["gcode_macro _TOOL_LED_CONF"] %}
    {% set n    = params.T | int %}
    {% set part = params.PART | default('logo') %}
    {% set tbl  = conf.logo if part == 'logo' else conf.nozzle %}
    {% set d    = tbl[params.STATE] %}
    SET_LED_EFFECT EFFECT=t{n}_{part} REPLACE=1 FADETIME={params.FADETIME|default(0.3)} LAYER={d[0]} RATE={d[1]} CUTOFF={d[2]} BLEND={d[3]} PALETTE={d[4]}


[gcode_macro _UPDATE_TOOL_LEDS]
description: Repaint every tool for the current state and active tool
gcode:
    {% set conf   = printer["gcode_macro _TOOL_LED_CONF"] %}
    # ACTIVE is passed explicitly from after_change_gcode, because
    # printer.toolchanger.tool_number is not guaranteed to have settled
    # by the time after_change_gcode runs.
    {% set active = params.ACTIVE | default(printer.toolchanger.tool_number) | int %}
    {% set state  = conf.state %}
    {% set noz    = conf.nozzle_for.get(state, 'off') %}
    {% set fade   = params.FADETIME | default(0.3) %}

    # tool_numbers only contains tools that are actually configured, so
    # commenting out a tool's cfg file removes it from this loop with no
    # other changes needed.
    {% for n in printer.toolchanger.tool_numbers %}
        {% if n == active %}
            _TOOL_LED T={n} PART=logo   STATE={state} FADETIME={fade}
            _TOOL_LED T={n} PART=nozzle STATE={noz}   FADETIME={fade}
        {% else %}
            _TOOL_LED T={n} PART=logo   STATE=docked FADETIME={fade}
            _TOOL_LED T={n} PART=nozzle STATE=off    FADETIME={fade}
        {% endif %}
    {% endfor %}


[gcode_macro _SET_TOOL_LED_STATE]
description: Set the logical state and repaint every tool
gcode:
    SET_GCODE_VARIABLE MACRO=_TOOL_LED_CONF VARIABLE=state VALUE='"{params.STATE}"'
    _UPDATE_TOOL_LEDS


######################################################################
#  Compatibility shims
#
#  Your old macros took no arguments and relied on `tool`, which is not
#  in scope inside a [gcode_macro]. These act on the active tool via
#  printer.toolchanger.tool_number instead.
######################################################################

[gcode_macro set_nozzle_leds_on]
gcode:
    {% set n = printer.toolchanger.tool_number | int %}
    {% if n >= 0 %}
        _TOOL_LED T={n} PART=nozzle STATE=on
    {% endif %}

[gcode_macro set_nozzle_leds_off]
gcode:
    {% set n = printer.toolchanger.tool_number | int %}
    {% if n >= 0 %}
        _TOOL_LED T={n} PART=nozzle STATE=off
    {% endif %}

[gcode_macro set_logo_leds_active]
gcode:
    {% set n = printer.toolchanger.tool_number | int %}
    {% if n >= 0 %}
        _TOOL_LED T={n} PART=logo STATE=ready
    {% endif %}

[gcode_macro set_logo_leds_idle]
gcode:
    {% set n = printer.toolchanger.tool_number | int %}
    {% if n >= 0 %}
        _TOOL_LED T={n} PART=logo STATE=idle
    {% endif %}

[gcode_macro set_logo_leds_off]
gcode:
    {% set n = printer.toolchanger.tool_number | int %}
    {% if n >= 0 %}
        _TOOL_LED T={n} PART=logo STATE=off
    {% endif %}


######################################################################
#  Startup
#  Without this the chains sit at whatever initial_RED/GREEN/BLUE the
#  [neopixel] sections set (all zero in your case, so: dark).
######################################################################

[delayed_gcode _TOOL_LEDS_STARTUP]
initial_duration: 3.0
gcode:
    _UPDATE_TOOL_LEDS ACTIVE=-1