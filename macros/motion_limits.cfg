# Fast limits for housekeeping moves (QGL, nozzle wipe, park, toolchanges)
#
# Orca (Klipper flavor) writes SET_VELOCITY_LIMIT for the machine limits at the
# top of the file and "SET_VELOCITY_LIMIT ACCEL=..." per feature (plus
# SQUARE_CORNER_VELOCITY if jerk control is on), all clamped by Printer
# settings > Motion ability. Klipper keeps whatever was set last, and
# SAVE_GCODE_STATE / RESTORE_GCODE_STATE do NOT cover velocity limits, so those
# values leak into any macro that runs mid-print and stay after the print ends.
#
#   _LIMITS_FAST      save the current (slicer) limits + speed factor, switch to
#                     the [printer] values and M220 S100
#                     optional: VELOCITY=<mm/s> ACCEL=<mm/s^2> SCV=<mm/s>
#   _LIMITS_RESTORE   put the saved limits back (ALL=1 unwinds every level)
#   _LIMITS_RESET     drop any saved state, go back to the [printer] values
#   _LIMITS           print the current state to the console
#
# Calls nest: only the outermost _LIMITS_FAST saves, and only its matching
# _LIMITS_RESTORE restores (e.g. WIPE_NOZZLE -> GOTO_WIPE_START).
# A _LIMITS_RESTORE with nothing saved does nothing, so an unpaired
# after_change_gcode (INITIALIZE_TOOLCHANGER) is harmless.

[gcode_macro _LIMITS]
description: Show housekeeping-move limit state
# Fast values used by _LIMITS_FAST. 0 = use the value from [printer].
variable_fast_velocity: 0
variable_fast_accel: 0
variable_fast_scv: 0
# Internal state - leave these alone
variable_depth: 0
variable_saved_velocity: 0
variable_saved_accel: 0
variable_saved_scv: 0
variable_saved_mcr: -1
variable_saved_speed_factor: 1.0
gcode:
    {% set v = printer["gcode_macro _LIMITS"] %}
    {% set th = printer.toolhead %}
    {action_respond_info("Limits: velocity %d  accel %d  scv %.1f  speed %d%%\nSaved (depth %d): velocity %d  accel %d  scv %.1f  speed %d%%" % (th.max_velocity, th.max_accel, th.square_corner_velocity, printer.gcode_move.speed_factor * 100, v.depth, v.saved_velocity, v.saved_accel, v.saved_scv, v.saved_speed_factor * 100))}

[gcode_macro _LIMITS_FAST]
description: Save current velocity limits and switch to fast ones
gcode:
    {% set v = printer["gcode_macro _LIMITS"] %}
    {% set th = printer.toolhead %}
    {% set cfg = printer.configfile.settings.printer %}
    {% set velocity = params.VELOCITY|default(v.fast_velocity if v.fast_velocity > 0 else cfg.max_velocity)|float %}
    {% set accel = params.ACCEL|default(v.fast_accel if v.fast_accel > 0 else cfg.max_accel)|float %}
    {% set scv = params.SCV|default(v.fast_scv if v.fast_scv > 0 else cfg.square_corner_velocity)|float %}
    {% if v.depth == 0 %}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=saved_velocity VALUE={th.max_velocity}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=saved_accel VALUE={th.max_accel}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=saved_scv VALUE={th.square_corner_velocity}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=saved_mcr VALUE={th.minimum_cruise_ratio if th.minimum_cruise_ratio is defined else -1}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=saved_speed_factor VALUE={printer.gcode_move.speed_factor}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=depth VALUE={v.depth + 1}
    SET_VELOCITY_LIMIT VELOCITY={velocity} ACCEL={accel} SQUARE_CORNER_VELOCITY={scv}
    {% if th.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio|default(0.5)}
    {% endif %}
    M220 S100

[gcode_macro _LIMITS_RESTORE]
description: Restore the limits saved by the outermost _LIMITS_FAST
gcode:
    {% set v = printer["gcode_macro _LIMITS"] %}
    {% set all = params.ALL|default(0)|int %}
    {% if v.depth > 1 and not all %}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=depth VALUE={v.depth - 1}
    {% elif v.depth >= 1 %}
        SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=depth VALUE=0
        SET_VELOCITY_LIMIT VELOCITY={v.saved_velocity} ACCEL={v.saved_accel} SQUARE_CORNER_VELOCITY={v.saved_scv}
        {% if v.saved_mcr >= 0 %}
            SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={v.saved_mcr}
        {% endif %}
        M220 S{v.saved_speed_factor * 100}
    {% endif %}

[gcode_macro _LIMITS_RESET]
description: Drop any saved limit state and return to the [printer] values
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    SET_GCODE_VARIABLE MACRO=_LIMITS VARIABLE=depth VALUE=0
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}
    {% if printer.toolhead.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio|default(0.5)}
    {% endif %}
    M220 S100
