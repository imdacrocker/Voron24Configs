[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% set prev = printer["gcode_macro _TOOL_LED_CONF"].state %}
        _SET_TOOL_LED_STATE STATE=homing
        G90
        G28
        M400
        _SET_TOOL_LED_STATE STATE={prev}
    {% endif %}