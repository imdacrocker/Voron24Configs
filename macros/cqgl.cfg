[gcode_macro _CQGL]
gcode:
    INITIALIZE_TOOLCHANGER
    {% if not printer.quad_gantry_level.applied %}
        {% set was_homed = "xyz" in printer.toolhead.homed_axes %}
        {% if was_homed %}
            SAVE_GCODE_STATE NAME=_cqgl
        {% else %}
            G90
            G28
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
        {% if was_homed %}
            RESTORE_GCODE_STATE NAME=_cqgl MOVE=1 MOVE_SPEED=150
        {% endif %}
    {% endif %}