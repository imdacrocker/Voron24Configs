[gcode_macro LOAD_FILAMENT]
description: Load filament using volumetric-based feed; optional heater-off. Errors if no tool is on the shuttle.
variable_turn_off_extruder: True      # used when TURN_OFF_EXTRUDER is left blank
gcode:
  # ----- Inputs (with defaults) -----
  # Keep these in THIS macro: Fluidd builds the parameter dropdown by scanning
  # only the clicked macro's gcode, not the macros it calls.
  {% set load_distance       = params.LOAD_DISTANCE       | default(50)  | float %}   # mm
  {% set load_extrusion_rate = params.LOAD_EXTRUSION_RATE | default(10)  | float %}   # mm^3/s
  {% set retract_distance    = params.RETRACT_DISTANCE    | default(10)  | float %}   # mm
  {% set target_temp         = params.TARGET_TEMP         | default(220) | float %}
  {% set min_temp            = params.MIN_TEMP            | default(180) | float %}

  # ----- Heater-off flag (blank = macro variable above) -----
  {% set _p = params.TURN_OFF_EXTRUDER | default(none) %}
  {% if _p is not none %}
    {% set turn_off_extruder = (_p|string)|lower in ["1","true","yes","on"] %}
  {% else %}
    {% set turn_off_extruder = printer["gcode_macro LOAD_FILAMENT"].turn_off_extruder %}
  {% endif %}

  # Check the shuttle BEFORE initializing, so a missing tool aborts here
  # instead of tripping the PAUSE inside _INITIALIZE_FROM_DETECTED_TOOL
  DETECT_ACTIVE_TOOL_PROBE
  _REQUIRE_ACTIVE_TOOL
  INITIALIZE_TOOLCHANGER
  # The load itself lives in its own macro so it renders AFTER the toolchanger
  # has set the active tool (a macro's template is evaluated when it starts)
  _LOAD_FILAMENT_RUN LOAD_DISTANCE={load_distance} LOAD_EXTRUSION_RATE={load_extrusion_rate} RETRACT_DISTANCE={retract_distance} TARGET_TEMP={target_temp} MIN_TEMP={min_temp} TURN_OFF_EXTRUDER={1 if turn_off_extruder else 0}

[gcode_macro _REQUIRE_ACTIVE_TOOL]
description: Abort the calling macro if no tool is detected on the shuttle
gcode:
  {% if printer.tool_probe_endstop.active_tool_number|int < 0 %}
    { action_raise_error("No tool on the shuttle - pick up a tool before loading or unloading filament") }
  {% endif %}

[gcode_macro _LOAD_FILAMENT_RUN]
description: Internal - called by LOAD_FILAMENT with every value already resolved
gcode:
    # ----- Inputs (defaults live in LOAD_FILAMENT) -----
    {% set load_distance       = params.LOAD_DISTANCE       | float %}   # mm
    {% set load_extrusion_rate = params.LOAD_EXTRUSION_RATE | float %}   # mm^3/s
    {% set retract_distance    = params.RETRACT_DISTANCE    | float %}   # mm
    {% set target_temp         = params.TARGET_TEMP         | float %}
    {% set min_temp            = params.MIN_TEMP            | float %}
    {% set turn_off_extruder   = params.TURN_OFF_EXTRUDER   | int == 1 %}

    # ----- Compute feeds from volumetric flow -----
    {% set ext_section = printer.toolhead.extruder %}
    {% if printer.configfile.config[ext_section].filament_diameter is defined %}
      {% set filament_dia = printer.configfile.config[ext_section].filament_diameter | float %}
    {% else %}
      {% set filament_dia = 1.75 %}
    {% endif %}
    {% set Af = 3.1416 * (filament_dia / 2)**2 %}                # filament cross-section (mm^2)
    {% set load_feed    = (load_extrusion_rate * 60) / Af %}      # mm/min
    {% set retract_feed = load_feed * 1.5 %}                      # 150% of load rate

    # ----- Heat if needed (checks the ACTIVE tool's heater, not always T0) -----
    SAVE_GCODE_STATE NAME=load_state
    M117 Heating for load...
    {% set heat_target = target_temp if target_temp >= min_temp else min_temp %}
    {% if printer[ext_section].temperature < heat_target %}
      M104 S{heat_target}
      M109 S{heat_target}
    {% endif %}

    # ----- Load & settle -----
    M117 Loading filament...
    G91
    G92 E0
    G1 E{load_distance} F{load_feed|int}
    G1 E-{retract_distance} F{retract_feed|int}

    # ----- Optional heater off -----
    {% if turn_off_extruder %}
      M104 S0
    {% endif %}

    # ----- Restore -----
    G90
    RESTORE_GCODE_STATE NAME=load_state
    M117 Filament load complete

[gcode_macro LOAD_FILAMENT_260]
description: Calls LOAD_FILAMENT with a target temp of 260c
gcode:
  LOAD_FILAMENT TARGET_TEMP=260