[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
gcode:
    {% set prev = printer["gcode_macro _TOOL_LED_CONF"].state %}
    {% if prev != 'leveling' %}
        _SET_TOOL_LED_STATE STATE=leveling
    {% endif %}
 
    _LIMITS_FAST
    BASE_QUAD_GANTRY_LEVEL {rawparams}
    _LIMITS_RESTORE
 
    {% if prev != 'leveling' %}
        M400
        _SET_TOOL_LED_STATE STATE={prev}
    {% endif %}