[gcode_macro _SELECT_TOOL_IF_NEEDED]
description: Select tool T unless it is already mounted
gcode:
    # This is its own macro so tool_number is read after _CQGL has run
    # (a macro's template is evaluated before any of its commands execute).
    {% set t = params.T | int %}
    {% if printer.toolchanger.tool_number | int != t %}
        SELECT_TOOL T={t} RESTORE_AXIS=XYZ
    {% endif %}
