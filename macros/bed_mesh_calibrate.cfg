[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
    {% set prev = printer["gcode_macro _TOOL_LED_CONF"].state %}
    {% if prev != 'meshing' %}
        _SET_TOOL_LED_STATE STATE=meshing
    {% endif %}
 
    BASE_BED_MESH_CALIBRATE {rawparams}
 
    {% if prev != 'meshing' %}
        M400
        _SET_TOOL_LED_STATE STATE={prev}
    {% endif %}