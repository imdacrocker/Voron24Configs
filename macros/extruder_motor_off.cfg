[gcode_macro EXTRUDER_MOTOR_OFF]
description: Disable the active tool's extruder motor so it can be turned by hand. Optional TOOL=<n> targets a specific tool.
gcode:
    {% set tc = printer.toolchanger %}
    {% set tn = params.TOOL|default(tc.tool_number)|int %}
    {% if tn not in tc.tool_numbers %}
      {% if params.TOOL is defined %}
        {action_raise_error("EXTRUDER_MOTOR_OFF: T%d is not a configured tool" % tn)}
      {% else %}
        {action_raise_error("EXTRUDER_MOTOR_OFF: no tool is active - pass TOOL=<n>")}
      {% endif %}
    {% endif %}
    {% set ext = printer[tc.tool_names[tc.tool_numbers.index(tn)]].extruder %}
    M400
    SET_STEPPER_ENABLE STEPPER={ext} ENABLE=0
    {action_respond_info("T%d extruder motor off (%s)" % (tn, ext))}